services:
  - type: web
    name: liftup
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_FRONTEND
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
